name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (https://docs.npmjs.com/trusted-publishers) for @laplace.live/chatterbox-sdk
      id-token: write
    outputs:
      published-packages: ${{ steps.changesets.outputs.published-packages }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: sudo npm install -g npm@latest

      - name: Build SDK
        run: bun run build:sdk

      # Release writes (the Version Packages PR, tags and GitHub Releases) use
      # a GitHub App token instead of `GITHUB_TOKEN`. Events caused by
      # `GITHUB_TOKEN` don't trigger other workflows, so the server's Releases
      # would never start build-server.yml, and checks on the Version Packages
      # PR would wait for manual approval.
      #
      # Requires the laplace-release-bot GitHub App installed on this repo with
      # Contents and Pull requests read & write, its Client ID and private key
      # stored in the `RELEASE_APP_CLIENT_ID` and `RELEASE_APP_PRIVATE_KEY` org
      # secrets.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Release Pull Request or Tag Releases
        id: changesets
        uses: changesets/action@v2
        with:
          # `changeset publish` publishes @laplace.live/chatterbox-sdk to npm
          # and only tags the private packages (`privatePackages.tag`); the
          # action pushes the tags.
          publish-script: bun run release
          version-script: bun run version
          commit-message: "Version Packages [skip ci]"
          # Releases are immutable once published, so nothing can be attached
          # afterwards: the action only pushes tags, and each release is
          # published whole, by github-releases below or, with its binaries,
          # by build-server.yml, which the pushed server tag fires.
          create-github-releases: false
          # v2 reads the token only from this input, not from the
          # `GITHUB_TOKEN` env var.
          github-token: ${{ steps.app-token.outputs.token }}

  # Reconciles rather than trusting this run's publish output, so a rerun or the
  # next push recovers a release that failed to publish.
  github-releases:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Publish releases for tagged versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The server's release is published by build-server.yml, with its binaries attached.
          for manifest in apps/*/package.json packages/*/package.json; do
            name=$(jq -r .name "$manifest")
            version=$(jq -r .version "$manifest")
            tag="$name@$version"
            [ "$name" = "@laplace.live/kakashi-server" ] && continue
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || status=$?
            # 2: not tagged yet. Anything else is a failed lookup, which must not pass for "nothing to release".
            if [ "$status" -eq 2 ]; then continue; fi
            if [ "$status" -ne 0 ]; then
              echo "::error::Could not look up $tag"
              exit 1
            fi
            sh .github/scripts/changelog-section.sh "$(dirname "$manifest")/CHANGELOG.md" "$version" > notes.md
            sh .github/scripts/publish-release.sh "$tag" notes.md
          done

  # Runs on this master push rather than on the tag, which the github-pages
  # environment's branch protection would reject.
  deploy-userscript:
    needs: release
    if: contains(fromJSON(needs.release.outputs.published-packages).*.name, 'laplace-chatterbox')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-userscript.yml
    secrets: inherit
